{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Download Files</title>
</head>
<body>
    <h2>Upload File</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    <h2>Available Files</h2>
    <ul>
        {% for file in files %}
            <li>
                {{ file.file_name }} - <a href="{{ file.file_url }}" target="_blank">Download</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
